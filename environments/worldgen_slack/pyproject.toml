[project]
name = "worldgen-slack"
version = "0.3.0"
description = "Actor-scoped Slack QA taskset with native LLM grading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.13.4",
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worldgen_slack"]
include = [
    "worldgen_slack/**/*.json",
    "worldgen_slack/**/*.md",
    "worldgen_slack/**/*.sql",
    "worldgen_slack/**/*.toml",
]

[tool.ruff]
line-length = 110

[tool.verifiers.eval]
num_examples = 100
rollouts_per_example = 1
