version = 1

[[criteria]]
name = "task_unambiguous"
description = "The task has one clear interpretation and one supported answer."
weight = 0.0
choices = ["no", "yes"]

[[criteria]]
name = "world_supports_task"
description = "Actor-visible Slack evidence supports every required answer claim."
weight = 0.0
choices = ["no", "yes"]

[[criteria]]
name = "scenario_alignment"
description = "The task and evidence fit the declared organization and workflow."
weight = 0.75
choices = ["fails", "weak", "adequate", "strong", "exceptional"]

[[criteria]]
name = "world_coherence"
description = "Entities, chronology, channels, threads, and facts form one consistent world."
weight = 1.00
choices = ["fails", "weak", "adequate", "strong", "exceptional"]

[[criteria]]
name = "professional_realism"
description = "Names, messages, roles, and work practices resemble a real workplace."
weight = 0.75
choices = ["fails", "weak", "adequate", "strong", "exceptional"]

[[criteria]]
name = "discoverability"
description = "The intended evidence is findable through natural read-only Slack actions."
weight = 1.25
choices = ["fails", "weak", "adequate", "strong", "exceptional"]

[[criteria]]
name = "shortcut_free"
description = "Public text and identifiers do not expose an answer cache or grading shortcut."
weight = 1.25
choices = ["fails", "weak", "adequate", "strong", "exceptional"]

[[criteria]]
name = "evidence_composition"
description = "Answering genuinely requires combining the intended evidence instead of finding one full-answer restatement."
weight = 1.00
choices = ["fails", "weak", "adequate", "strong", "exceptional"]
