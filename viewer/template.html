<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worldgen viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0e0e0e;--card:#151515;--raise:#1b1b1b;--line:#2a2a2a;--soft:#202020;--fg:#f4f4f4;--fg2:rgba(255,255,255,.64);--fg3:rgba(255,255,255,.42);
--good:#85ed75;--warn:#f3bc56;--bad:#fb7185;--ev:#8b7cf6;--evbg:rgba(139,124,246,.12);--sel:rgba(255,255,255,.07);--bar:rgba(255,255,255,.5);
--sans:Geist,"Geist Fallback",ui-sans-serif,system-ui,sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#fafafa;--card:#fff;--raise:#f3f3f3;--line:#e2e2e2;--soft:#ececec;--fg:#111;--fg2:rgba(0,0,0,.64);--fg3:rgba(0,0,0,.46);
--good:#0a7d2c;--warn:#9a6400;--bad:#c4262e;--ev:#5b45d6;--evbg:rgba(91,69,214,.09);--sel:rgba(0,0,0,.05);--bar:rgba(0,0,0,.45);color-scheme:light}}
:root[data-theme=light]{--bg:#fafafa;--card:#fff;--raise:#f3f3f3;--line:#e2e2e2;--soft:#ececec;--fg:#111;--fg2:rgba(0,0,0,.64);--fg3:rgba(0,0,0,.46);
--good:#0a7d2c;--warn:#9a6400;--bad:#c4262e;--ev:#5b45d6;--evbg:rgba(91,69,214,.09);--sel:rgba(0,0,0,.05);--bar:rgba(0,0,0,.45);color-scheme:light}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg)}body{font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.mono,.label,.chip,.tab,code{font-family:var(--mono)}.label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3)}
.muted{color:var(--fg2)}.faint{color:var(--fg3)}.small{font-size:12px}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.nowrap{white-space:nowrap}
header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;background:var(--bg)}
.bar{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}.brand{font:500 13px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.brand b{font-weight:500;color:var(--fg3)}.spacer{flex:1}
select,input[type=search]{background:var(--card);border:1px solid var(--line);border-radius:0;padding:6px 10px;min-width:0}
.btn{background:var(--card);border:1px solid var(--line);padding:6px 12px;font:12px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.btn:hover,.btn[aria-pressed=true]{background:var(--raise);border-color:var(--fg3)}
nav{display:flex;gap:0;padding:0 24px;overflow-x:auto}.tab{background:none;border:0;border-bottom:1px solid transparent;padding:10px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg2)}
.tab sup{color:var(--fg3);margin-left:4px;font-size:10px}.tab[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
main{padding:24px;max-width:1600px;margin:0 auto}section{margin-bottom:28px}
.card{background:var(--card);border:1px solid var(--line);padding:16px;min-width:0}
.hero h1{font:500 30px/1.2 var(--sans);margin:4px 0 6px}.hero p{max-width:900px;margin:6px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.tile{background:var(--card);padding:14px 16px}.tile .v{font:500 24px/1.2 var(--sans);margin-top:6px}.tile .s{font:11px var(--mono);color:var(--fg3);margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
th{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);font-weight:400}td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td,tr.on td{background:var(--sel)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);padding:1px 7px;font-size:11px;letter-spacing:.03em;margin:2px 4px 2px 0;background:none;white-space:nowrap}
button.chip:hover{border-color:var(--fg3)}.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.chip.ev{color:var(--ev);border-color:color-mix(in srgb,var(--ev) 50%,transparent)}.chip.solid{background:var(--raise)}
.meter{display:inline-block;width:64px;height:4px;background:var(--soft);vertical-align:middle;margin-right:6px}.meter i{display:block;height:100%;background:var(--bar)}
.hbar{display:grid;grid-template-columns:120px 1fr 48px;align-items:center;gap:10px;padding:4px 0}.hbar .track{height:8px;background:var(--soft)}.hbar .track i{display:block;height:100%;background:var(--bar)}
/* lineage */
.graphwrap{position:relative;overflow-x:auto;border:1px solid var(--line);background:var(--card)}
.graph{position:relative;display:flex;gap:84px;padding:20px 24px 28px;min-width:min-content}.graph svg.edges{position:absolute;inset:0;pointer-events:none;overflow:visible}
.col{display:flex;flex-direction:column;gap:36px;min-width:220px;max-width:260px}.colhead{font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);border-bottom:1px solid var(--line);padding-bottom:6px}
.node{position:relative;z-index:1;text-align:left;background:var(--bg);border:1px solid var(--line);padding:10px 12px;width:100%}
.node:hover{border-color:var(--fg3)}.node.on{border-color:var(--fg)}.node.good{box-shadow:inset 2px 0 0 var(--good)}.node.bad{box-shadow:inset 2px 0 0 var(--bad)}.node.warn{box-shadow:inset 2px 0 0 var(--warn)}
.node .id{font:500 12px var(--mono)}.node .steps{font:11px/1.6 var(--mono);color:var(--fg2);margin-top:6px}
.edge{fill:none;stroke-width:1.25}.edge.good{stroke:var(--good)}.edge.bad{stroke:var(--bad)}.edge.plain{stroke:var(--fg3)}
.elabel{font:10px var(--mono);letter-spacing:.04em;text-transform:uppercase;fill:var(--fg2)}.elabel-bg{fill:var(--card)}
.timeline svg{display:block;width:100%}.lane-label{font:11px var(--mono);fill:var(--fg3);text-transform:uppercase;letter-spacing:.06em}
.tick{font:10px var(--mono);fill:var(--fg3)}.gridline{stroke:var(--soft)}.band{fill:var(--sel)}.band-label{font:10px var(--mono);fill:var(--fg3)}
.tbar{fill:var(--bar)}.tbar.fail{fill:none;stroke:var(--bad);stroke-width:1.5}.tbar:hover{fill:var(--fg)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--raise);border:1px solid var(--line);padding:8px 10px;font:11px/1.5 var(--mono);max-width:360px;display:none}
.issue{border-top:1px solid var(--soft);padding:10px 0}.issue:first-child{border-top:0}
/* world */
.world{display:grid;grid-template-columns:260px minmax(0,1fr) 360px;border:1px solid var(--line);background:var(--card);height:calc(100vh - 170px);min-height:520px}
.side{border-right:1px solid var(--line);overflow:auto;padding:12px}.pane{overflow:auto;min-width:0}.thread{border-left:1px solid var(--line);overflow:auto;padding:14px}
.conv{display:flex;width:100%;gap:8px;align-items:center;background:none;border:0;text-align:left;padding:5px 8px;color:var(--fg2)}.conv:hover,.conv.on{background:var(--sel);color:var(--fg)}
.conv .n{margin-left:auto;font:11px var(--mono);color:var(--fg3)}.conv .dot{color:var(--ev);font-size:10px}
.chan-head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;z-index:1}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;padding:10px 16px;border-left:2px solid transparent}.msg:hover{background:var(--sel)}
.msg.ev{border-left-color:var(--ev);background:var(--evbg)}.msg.flash{outline:1px solid var(--fg)}
.av{width:32px;height:32px;display:grid;place-items:center;background:var(--raise);border:1px solid var(--line);font:500 11px var(--mono);color:var(--fg2)}
.who{font-weight:600}.when{font:11px var(--mono);color:var(--fg3);margin-left:8px}.text{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
.linkish{background:none;border:0;padding:0;color:var(--fg2);font:11px var(--mono);text-decoration:underline;text-underline-offset:3px}
/* tasks */
.tasks{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}.tlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);align-self:start}
.titem{background:var(--card);border:0;text-align:left;padding:10px 12px}.titem:hover,.titem.on{background:var(--raise)}
.q{font:500 21px/1.35 var(--sans);margin:6px 0 10px}.step{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--soft)}
.step .k{font:11px var(--mono);color:var(--fg3);padding-top:2px}.evmsg{border:1px solid var(--line);border-left:2px solid var(--ev);padding:8px 10px;margin:6px 0;background:var(--bg);text-align:left;width:100%}
.solves{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.spoiler{filter:blur(6px);user-select:none}.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:28px;color:var(--fg3);font:12px var(--mono);text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:16px}
@media (max-width:1100px){.world{grid-template-columns:220px minmax(0,1fr)}.thread{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}.split{grid-template-columns:1fr}}
@media (max-width:760px){main{padding:16px}.bar,nav{padding-left:16px;padding-right:16px}.world{grid-template-columns:1fr;height:auto}.side{border-right:0;border-bottom:1px solid var(--line);max-height:240px}
.pane{max-height:70vh}.tasks{grid-template-columns:1fr}.hero h1{font-size:24px}.grid2{grid-template-columns:1fr}.hbar{grid-template-columns:90px 1fr 40px}}
@media (forced-colors:active){.node.good,.node.bad,.node.warn{box-shadow:none;border-width:2px}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Zawarudo <b>/</b> Worldgen viewer</div>
    <label class="label" for="run">Run</label><select id="run"></select>
    <div class="spacer"></div>
    <button class="btn" id="spoil" type="button" aria-pressed="true" title="Show private answers, facts and evidence marks">Answers shown</button>
    <button class="btn" id="theme" type="button">Theme</button>
  </div>
  <nav role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div id="tip" role="tooltip"></div>
<script id="viewer-data" type="application/json">__VIEWER_DATA__</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('viewer-data').textContent);
const TABS = [['overview', 'Overview'], ['lineage', 'Lineage'], ['world', 'World'], ['tasks', 'Tasks'], ['cast', 'Cast'], ['traces', 'Traces']];
const ROLES = ['synthesizer', 'builder', 'writer', 'solver', 'judge'];
const S = {tab: 'overview', run: 0, attempt: null, snapshot: null, conv: null, message: null, reader: '', search: '', task: null, trace: null, role: '', spoilers: true};
let R, X;  // the selected run and its indexes

function h(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = String(v);
    else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false) node.append(kid instanceof Node ? kid : String(kid));
  return node;
}
const svg = (tag, props, ...kids) => {
  const node = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(props || {})) if (v !== undefined && v !== null) {
    if (k === 'text') node.textContent = String(v); else if (k.startsWith('on')) node.addEventListener(k.slice(2), v); else node.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid) node.append(kid);
  return node;
};
const label = t => h('div', {class: 'label', text: t});
const empty = t => h('div', {class: 'empty', text: t});
const list = v => Array.isArray(v) ? v : [];
const pct = v => v === null || v === undefined ? '–' : Math.round(v * 100) + '%';
const num = v => v === null || v === undefined ? '–' : Number(v).toLocaleString('en-US');
const usd = v => v === null || v === undefined ? '–' : '$' + Number(v).toFixed(2);
const dur = s => s === null || s === undefined || isNaN(s) ? '–' : s < 60 ? Math.round(s) + 's' : s < 3600 ? (s / 60).toFixed(1) + 'm' : (s / 3600).toFixed(2) + 'h';
const short = (t, n = 140) => { t = String(t ?? ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };
const initials = name => String(name || '?').split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
const status = (ok, yes = 'Approved', no = 'Rejected') => ok === null || ok === undefined ? h('span', {class: 'chip', text: '… Pending'})
  : h('span', {class: 'chip ' + (ok ? 'good' : 'bad'), text: (ok ? '✓ ' : '✕ ') + (ok ? yes : no)});
const meter = v => h('span', {class: 'nowrap'}, h('span', {class: 'meter'}, h('i', {style: `width:${Math.round((v || 0) * 100)}%`})), h('span', {class: 'mono small', text: v === undefined ? '–' : Number(v).toFixed(2)}));
function spoil(node) { if (!S.spoilers) node.classList.add('spoiler'); return node; }
function utc(ts, zone) {
  if (!ts) return '';
  const d = new Date(ts);
  const f = new Intl.DateTimeFormat('en-GB', {timeZone: zone || 'UTC', weekday: 'short', month: 'short', day: '2-digit', hour: '2-digit', minute: '2-digit'});
  return f.format(d) + (zone ? '' : ' UTC');
}

/* ---------- indexes ---------- */
function view(world) {
  const convs = Object.fromEntries(list(world.conversations).map(c => [c.id, c]));
  const msgs = Object.fromEntries(list(world.messages).map(m => [m.id, m]));
  const replies = {};
  for (const m of list(world.messages)) if (m.thread_root_id) (replies[m.thread_root_id] ||= []).push(m);
  return {world, convs, msgs, replies};
}
const V = () => S.snapshot && R.snapshots[S.snapshot] ? (X.views[S.snapshot] ||= view(R.snapshots[S.snapshot])) : X;
function index(run) {
  const cat = run.catalog || {};
  const attemptsInOrder = run.attempts;
  let world = run.world;
  if (!world) for (const a of [...attemptsInOrder].reverse()) if (a.snapshot) { world = run.snapshots[a.snapshot]; break; }
  world = world || {users: [], conversations: [], messages: []};
  const people = Object.fromEntries(list(cat.people || world.users).map(p => [p.id, p]));
  const personas = Object.fromEntries(list(cat.personas).map(p => [p.id, p]));
  const {convs, msgs, replies} = view(world);
  const evidence = {};  // message -> [[task, claim]]
  for (const [t, b] of Object.entries(run.bindings || {})) for (const c of list(b.claims)) for (const m of list(c.message_ids)) (evidence[m] ||= []).push([t, c.claim_index]);
  const tasks = Object.fromEntries(list(cat.tasks).map(t => [t.id, t]));
  const facts = Object.fromEntries(list(cat.facts).map(f => [f.id, f]));
  const scenes = Object.fromEntries(list(run.scenes).map(s => [s.id, s]));
  const traces = Object.fromEntries(run.traces.map(t => [t.id, t]));
  const events = run.events;
  const t0 = Math.min(...[...events.map(e => e.time), ...run.traces.map(t => t.start).filter(Boolean)]);
  const t1 = Math.max(...[...events.map(e => e.time), ...run.traces.map(t => t.end).filter(Boolean)]);
  // attempt windows, outcomes and routes
  const win = {}, outcome = {}, routed = {}, interrupted = {};
  for (const e of events) {
    if (e.event === 'candidate_started') win[e.attempt] = [e.time, null];
    if (e.event === 'candidate_finished' && win[e.attempt]) { win[e.attempt][1] = e.time; outcome[e.attempt] = e.approved; }
    if (e.event === 'attempt_routed') routed[e.attempt] = e.route;
    if (e.event === 'scenes_repaired') routed[e.attempt] = 'repair';
    if (e.event === 'bindings_repaired') routed[e.attempt] = 'rebind';
    if (e.event === 'candidate_reused') routed[e.attempt] = 'reuse';
    if (e.event === 'interrupted') interrupted[e.attempt] = true;
    if (e.event === 'premise_selected') { win.premise = [t0, e.time]; outcome.premise = true; }
  }
  for (const a of attemptsInOrder) {
    if (outcome[a.id] === undefined) {
      if (a.verdict) outcome[a.id] = a.verdict.approved;
      else if (a.validation && a.validation.ok === false) outcome[a.id] = false;
    }
  }
  const attemptOf = tr => {
    if (tr.attempt && win[tr.attempt]) return tr.attempt;
    let best = null;
    for (const [id, [s, e]] of Object.entries(win)) if (tr.start >= s - 1 && (e === null || tr.start <= e + 1) && (!best || s > win[best][0])) best = id;
    return best;
  };
  const byAttempt = {};
  for (const tr of run.traces) (byAttempt[attemptOf(tr)] ||= []).push(tr);
  return {cat, world, people, personas, convs, msgs, replies, evidence, tasks, facts, scenes, traces, t0, t1, win, outcome, routed, interrupted, byAttempt, views: {}};
}
const personName = id => X.people[id]?.name || id;
function column(id) {
  if (id === 'premise') return 'premise';
  if (id.startsWith('catalog')) return 'catalog';
  if (id.startsWith('final')) return 'final';
  const m = id.match(/^build-(.+)-\d+$/);
  return m ? m[1] : 'other';
}
function routeOf(a, i, all) {
  const col = column(a.id), prev = all[i - 1];
  if (col === 'premise') return 'seed pick';
  if (prev && X.interrupted[prev.id] && X.outcome[prev.id] === undefined) return 'resume';
  if (col === 'catalog') return !prev || column(prev.id) === 'premise' ? 'catalog' : column(prev.id) === 'catalog' ? 'repair' : 'catalog repair';
  if (col === 'final') return 'final review';
  const r = X.routed[a.id];
  if (prev && column(prev.id) === col) return r === 'plan' || !r ? 're-plan' : r;
  if (prev && column(prev.id) === 'final') return 'regression';
  return r === 'reuse' ? 'reuse' : 'build';
}

/* ---------- chrome ---------- */
function renderChrome() {
  const runSel = document.getElementById('run');
  runSel.replaceChildren(...DATA.runs.map((r, i) => h('option', {value: i, text: r.name})));
  runSel.value = S.run;
  runSel.onchange = () => { S.run = +runSel.value; S.attempt = S.snapshot = S.conv = S.message = S.task = S.trace = null; load(); };
  const tabs = document.getElementById('tabs');
  tabs.replaceChildren(...TABS.map(([id, name], i) => h('button', {class: 'tab', role: 'tab', 'aria-selected': S.tab === id ? 'true' : 'false',
    onclick: () => go(id)}, name, h('sup', {text: String(i + 1).padStart(2, '0')}))));
  const spoil = document.getElementById('spoil');
  spoil.setAttribute('aria-pressed', String(S.spoilers));
  spoil.textContent = S.spoilers ? 'Answers shown' : 'Answers hidden';
  spoil.onclick = () => { S.spoilers = !S.spoilers; renderChrome(); render(); };
  document.getElementById('theme').onclick = () => {
    const root = document.documentElement, dark = getComputedStyle(root).colorScheme.includes('dark');
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('worldgen-theme', root.dataset.theme); } catch (e) { /* storage may be unavailable */ }
    render();
  };
}
function go(tab, patch) { Object.assign(S, patch || {}); S.tab = tab; renderChrome(); render(); window.scrollTo(0, 0); }
function load() { R = DATA.runs[S.run]; X = index(R); renderChrome(); render(); }
function render() {
  const main = document.getElementById('main');
  main.replaceChildren(({overview, lineage, world, tasks, cast, traces})[S.tab]());
  if (S.tab === 'lineage') requestAnimationFrame(drawEdges);
}

/* ---------- overview ---------- */
function overview() {
  const sum = R.summary || {}, p = R.premise || {}, cat = X.cat;
  const reviews = Object.values(R.task_reviews || {});
  const rates = reviews.map(r => r.solve_rate).filter(v => v !== undefined);
  const rejected = R.attempts.filter(a => X.outcome[a.id] === false).length;
  const tiles = [
    ['Status', sum.status || R.phase, sum.reason ? short(sum.reason, 40) : 'phase ' + R.phase],
    ['Messages', num(list(X.world.messages).length), num(list(X.world.conversations).length) + ' conversations'],
    ['Tasks', num(list(cat.tasks).length), num(list(cat.groups).length) + ' groups · ' + num(list(cat.facts).length) + ' facts'],
    ['People', num(list(cat.people).length), list(cat.personas).filter(x => x.profile).length ? 'seeded from personas' : 'written by synthesizer'],
    ['Attempts', num(R.attempts.length), rejected + ' rejected'],
    ['Cost', usd(sum.reported_model_cost), 'priced calls only'],
    ['Wall time', dur(sum.elapsed_seconds ?? (X.t1 - X.t0)), 'first to last event'],

      list(scene.beats).length ? h('div', {}, label('Beats'), list(scene.beats).map(b => spoil(h('p', {class: 'small'}, h('span', {class: 'chip', text: b.fact_id}),
        `${personName(b.author_id)} states ${X.facts[b.fact_id]?.predicate || ''}: ${X.facts[b.fact_id]?.value || ''}`)))) : null,
      scene.revision_note ? h('p', {class: 'small warn'}, h('span', {class: 'label', text: 'Revision note  '}), scene.revision_note) : null,
      list(scene.promises).length ? h('div', {}, label('Promises left open'), list(scene.promises).map(p => h('p', {class: 'small muted', text: p}))) : null) : null);
  requestAnimationFrame(() => document.getElementById('m-' + root.id)?.scrollIntoView({block: 'nearest'}));
}

/* ---------- tasks ---------- */
function solvesFor(t) {
  const review = R.task_reviews?.[t];
  if (review?.results?.length) return review.results;
  for (const a of [...R.attempts].reverse()) {
    const solves = list((a.reviews?.[t] || a.reviews?.tasks)?.solves).filter(s => s.task_id === t);
    if (solves.length) return solves;
  }
  return [];
}
function tasks() {
  const all = list(X.cat.tasks);
  if (!all.length) return empty('No catalog yet');
  if (!S.task || !X.tasks[S.task]) S.task = all[0].id;
  const t = X.tasks[S.task];
  const left = h('div', {class: 'tlist'}, all.map(x => h('button', {type: 'button', class: 'titem' + (x.id === S.task ? ' on' : ''), onclick: () => { S.task = x.id; render(); }},
    h('div', {}, h('span', {class: 'mono small', text: x.id}), ' ', h('span', {class: 'faint small mono', text: x.group_id})),
    h('div', {class: 'small clamp', text: x.question}), h('div', {}, solveDots(solvesFor(x.id))))));
  return h('div', {class: 'tasks'}, left, taskDetail(t));
}
function taskDetail(t) {
  const reader = X.people[t.actor_id], persona = X.personas[t.actor_id];
  const binding = R.bindings?.[t.id];
  const chain = R.chains?.[t.id];
  const solves = solvesFor(t.id);
  let verdict = null;
  for (const a of [...R.attempts].reverse()) {
    const own = a.reviews?.[t.id]?.verdict, batch = a.reviews?.tasks?.verdict;
    if (own) { verdict = [a.id, own]; break; }
    if (batch && list(batch.tasks).some(r => r.task_id === t.id)) {
      verdict = [a.id + ' · batch', {...batch, issues: list(batch.issues).filter(i => !list(i.task_ids).length || i.task_ids.includes(t.id))}];
      break;
    }
  }
  const evidence = new Set(list(binding?.claims).flatMap(c => c.message_ids));
  return h('div', {},
    h('div', {class: 'card'}, label(`${t.id} · ${t.group_id}`), h('div', {class: 'q', text: t.question}),
      h('span', {class: 'chip', text: 'reader · ' + (reader?.name || t.actor_id) + (persona ? ' · ' + persona.role : '')}),
      h('span', {class: 'chip', text: 'kind · ' + t.answer.kind}),
      h('span', {class: 'chip', text: 'solve rate · ' + pct(R.task_reviews?.[t.id]?.solve_rate)})),
    h('div', {class: 'card', style: 'margin-top:12px'}, label('Answer'),
      spoil(h('p', {style: 'font-size:16px', text: t.answer.canonical_answer})),
      list(t.answer.required_claims).map((claim, k) => {
        const ev = list(binding?.claims).find(c => c.claim_index === k);
        return h('div', {class: 'step'}, h('div', {class: 'k', text: String(k).padStart(2, '0')}),
          h('div', {}, spoil(h('div', {text: claim})), S.spoilers ? list(ev?.message_ids).map(id => evidenceCard(id)) : null,
            S.spoilers ? list(ev?.user_ids).map(u => h('span', {class: 'chip ev', text: 'directory · ' + personName(u)})) : null));
      }),
      spoil(h('p', {class: 'small muted'}, h('span', {class: 'label', text: 'Reasoning  '}), t.reasoning)),
      S.spoilers ? h('div', {}, label('Facts'), list(t.fact_ids).map(f => X.facts[f] ? h('p', {class: 'small'}, h('span', {class: 'chip', text: f}),
        `${X.facts[f].subject} · ${X.facts[f].predicate}: ${X.facts[f].value}`, h('span', {class: 'faint mono', text: `  from ${X.facts[f].valid_from}${X.facts[f].valid_until ? ' until ' + X.facts[f].valid_until : ''}`})) : null)) : null),
    h('div', {class: 'card', style: 'margin-top:12px'}, label('Gold route'), h('p', {class: 'small muted', text: 'The replayed read calls that establish the answer from the reader’s view. Violet results are bound evidence; “feeds” marks IDs a later call uses.'}),
      chain ? chain.map((s, k) => h('div', {class: 'step'}, h('div', {class: 'k', text: String(k + 1).padStart(2, '0')}),
        h('div', {}, h('code', {class: 'small', text: `${s.call.action}(${Object.entries(s.call.arguments || {}).filter(([, v]) => v !== null).map(([a, v]) => `${a}=${JSON.stringify(v)}`).join(', ')})`}),
          h('div', {class: 'small muted', text: `returned ${s.returned} · ${s.evidence.length} evidence`}),
          list(s.feeds).map(f => h('span', {class: 'chip', text: 'feeds ' + f})),
          S.spoilers ? s.evidence.map(id => evidenceCard(id)) : null)))
        : empty('No saved route outputs for the current binding')),
    h('div', {class: 'card', style: 'margin-top:12px'}, label(`Independent solves (${solves.length})`),
      solves.length ? h('div', {class: 'solves'}, solves.map((s, k) => solveCard(s, k, evidence))) : empty('No solves recorded')),
    verdict ? h('div', {class: 'card', style: 'margin-top:12px'}, label(`Task judge · ${verdict[0]}`), status(verdict[1].approved),
      h('p', {text: verdict[1].summary}), Object.entries(verdict[1].criteria || {}).map(([k, v]) => h('div', {class: 'small'}, meter(v), ' ', h('span', {class: 'faint', text: k}))),
      issueList(list(verdict[1].issues))) : null);
}
function evidenceCard(id) {
  const m = X.msgs[id];
  if (!m) return h('span', {class: 'chip bad', text: id + ' (missing)'});
  const c = X.convs[m.conversation_id];
  return h('button', {class: 'evmsg', type: 'button', onclick: () => openMessage(id)},
    h('div', {class: 'small'}, h('b', {text: personName(m.author_id)}), h('span', {class: 'when', text: `${utc(m.timestamp)} · ${c?.name || c?.kind || ''}`})),
    h('div', {class: 'text small', text: m.text}));
}
function solveCard(s, k, evidence) {
  const trace = X.traces[s.solver_trace_id] || null;
  const good = s.correct && s.grounded;
  return h('div', {class: 'card', style: 'background:var(--bg)'},
    h('div', {}, h('span', {class: 'mono small', text: `solve ${k + 1}  `}), h('span', {class: 'chip ' + (s.correct ? 'good' : 'bad'), text: s.correct ? '✓ correct' : '✕ wrong'}),
      h('span', {class: 'chip ' + (s.grounded ? 'good' : 'warn'), text: s.grounded ? '✓ grounded' : '! ungrounded'}), h('span', {class: 'chip', text: `${s.read_count ?? '–'} reads`})),
    trace?.route ? h('div', {style: 'margin:8px 0'}, trace.route.map((r, i) => h('div', {class: 'small mono'},
      `${i + 1}. ${r.call.action}(${Object.entries(r.call.arguments || {}).filter(([, v]) => v !== null).map(([a, v]) => `${a}=${JSON.stringify(v)}`).join(', ')})`,
      S.spoilers && r.messages.some(m => evidence.has(m)) ? h('span', {class: 'chip ev', text: 'hits evidence'}) : null))) : null,
    h('details', {}, h('summary', {class: 'label', text: 'Answer'}), h('div', {class: 'pre small', text: s.response || ''})),
    s.reason ? h('p', {class: 'small muted', text: s.reason}) : null,
    trace ? h('button', {class: 'linkish', type: 'button', text: 'open trace', onclick: () => go('traces', {trace: trace.id})}) : null);
}

/* ---------- cast ---------- */
function measured(id) {
  const texts = list(X.world.messages).filter(m => m.author_id === id && !m.deleted).map(m => m.text.trim());
  if (!texts.length) return null;
  const words = texts.map(t => t.split(/\s+/).filter(Boolean).length).sort((a, b) => a - b);
  const mid = words.length / 2, share = f => texts.filter(f).length / texts.length;
  return {messages: texts.length, median_words: words.length % 2 ? words[Math.floor(mid)] : (words[mid - 1] + words[mid]) / 2,
    short_share: words.filter(w => w <= 4).length / texts.length, question_share: share(t => t.includes('?')), lowercase_share: share(t => /^[a-z]/.test(t)),
    emoji_share: share(t => /:[a-z0-9_+-]+:|\p{Extended_Pictographic}/u.test(t))};
}
function cast() {
  const people = list(X.cat.people);
  if (!people.length) return empty('No catalog yet');
  const keys = [['median_words', 'median words', v => (+v).toFixed(v % 1 ? 1 : 0)], ['short_share', '≤ 4 words', pct], ['question_share', 'questions', pct], ['lowercase_share', 'lowercase start', pct], ['emoji_share', 'emoji', pct]];
  return h('div', {}, h('p', {class: 'small muted', text: 'Typing targets come from real Slack users; measured values are this world’s messages by each person.'}),
    h('div', {class: 'people'}, people.map(p => {
      const persona = X.personas[p.id] || {}, prof = persona.profile, got = measured(p.id);
      return h('div', {class: 'card'},
        h('div', {style: 'display:flex;gap:10px;align-items:center'}, h('div', {class: 'av', text: initials(p.name)}),
          h('div', {}, h('div', {style: 'font-weight:600', text: p.name}), h('div', {class: 'small muted', text: [persona.role, persona.seniority, p.team].filter(Boolean).join(' · ')}))),
        h('p', {class: 'small mono faint', text: [persona.timezone, prof && `${prof.age} · ${prof.city}, ${prof.state}`, prof && prof.occupation].filter(Boolean).join(' · ')}),
        persona.voice ? h('p', {class: 'small'}, h('span', {class: 'label', text: 'Voice  '}), persona.voice) : null,
        prof ? h('details', {}, h('summary', {class: 'label', text: 'Profile'}), h('p', {class: 'small', text: prof.persona}), h('p', {class: 'small muted', text: prof.cultural_background}),
          h('div', {}, list(prof.hobbies).map(x => h('span', {class: 'chip', text: x})))) : null,
        h('table', {style: 'margin-top:8px'}, h('tr', {}, h('th', {text: 'typing'}), h('th', {class: 'num', text: 'target'}), h('th', {class: 'num', text: 'measured'})),
          keys.map(([k, name, f]) => h('tr', {}, h('td', {class: 'small', text: name}), h('td', {class: 'num small', text: prof?.typing ? f(prof.typing[k]) : '–'}),
            h('td', {class: 'num small', text: got ? f(got[k]) : '–'})))),
        h('p', {class: 'small faint mono', text: got ? `${got.messages} messages` : 'never posts'}));
    })));
}

/* ---------- traces ---------- */
function traces() {
  const rows = R.traces.filter(t => !S.role || t.role === S.role);
  const sel = X.traces[S.trace];
  const table = h('div', {class: 'card', style: 'overflow-x:auto'},
    h('div', {style: 'margin-bottom:10px'}, ['', ...ROLES].map(r => h('button', {class: 'btn', type: 'button', 'aria-pressed': String(S.role === r), style: 'margin-right:6px',
      text: r || 'all', onclick: () => { S.role = r; render(); }}))),
    h('table', {}, h('tr', {}, ['at', 'role', 'attempt', 'task / scene', 'dur', 'input', 'cached', 'output', 'cost', ''].map((c, i) => h('th', {class: i > 3 ? 'num' : '', text: c}))),
      rows.map(t => h('tr', {class: 'click' + (S.trace === t.id ? ' on' : ''), onclick: () => { S.trace = t.id; render(); }},
        h('td', {class: 'mono small', text: dur(t.start - X.t0)}), h('td', {class: 'mono small', text: t.role}),
        h('td', {class: 'mono small', text: Object.entries(X.byAttempt).find(([, v]) => v.includes(t))?.[0] || ''}),
        h('td', {class: 'mono small', text: t.task_id || t.scene_id || ''}), h('td', {class: 'num small', text: dur((t.end || t.start) - t.start)}),
        h('td', {class: 'num small', text: num(t.input_tokens)}), h('td', {class: 'num small', text: num(t.cached_tokens)}), h('td', {class: 'num small', text: num(t.output_tokens)}),
        h('td', {class: 'num small', text: t.cost === null ? 'unpriced' : usd(t.cost)}), h('td', {}, t.ok === false ? h('span', {class: 'chip bad', text: '✕'}) : null)))));
  return h('div', {class: 'split'}, table, sel ? traceDetail(sel) : h('div', {class: 'card'}, empty('Select an agent run')));
}
function traceDetail(t) {
  return h('div', {class: 'card', style: 'align-self:start;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto'},
    label(t.role + ' · ' + t.model), h('div', {class: 'mono small', text: t.id}),
    h('pre', {class: 'pre small mono muted', text: traceTip(t)}),
    t.evaluation ? h('div', {}, label('Evaluation'), h('p', {}, status(t.evaluation.correct, 'correct', 'wrong'), status(t.evaluation.grounded, 'grounded', 'ungrounded')),
      h('div', {class: 'pre small', text: t.evaluation.response || ''}), h('p', {class: 'small muted', text: t.evaluation.reason || ''})) : null,
    t.route ? h('div', {}, label('Reads'), t.route.map((r, i) => h('div', {class: 'small mono', text: `${i + 1}. ${r.call.action} ${JSON.stringify(Object.fromEntries(Object.entries(r.call.arguments || {}).filter(([, v]) => v !== null)))} → ${r.messages.length} msgs`}))) : null,
    t.messages ? h('div', {}, label(`Transcript (${t.messages.length})`), t.messages.map(m => h('details', {open: m.role !== 'system' ? true : null},
      h('summary', {class: 'label', text: m.role + (m.tool_calls?.length ? ` · ${m.tool_calls.length} tool call(s)` : '')}),
      h('div', {class: 'pre small', text: typeof m.content === 'string' ? m.content : JSON.stringify(m.content, null, 1)}),
      m.tool_calls?.length ? h('div', {class: 'pre small mono muted', text: JSON.stringify(m.tool_calls, null, 1)}) : null)))
      : h('p', {class: 'small faint', text: 'Transcripts are embedded only when the page is built with --traces.'}));
}

try { const saved = localStorage.getItem('worldgen-theme'); if (saved) document.documentElement.dataset.theme = saved; } catch (e) { /* storage may be unavailable */ }
if (DATA.runs.length) load(); else document.getElementById('main').replaceChildren(empty('No runs embedded'));
</script>
