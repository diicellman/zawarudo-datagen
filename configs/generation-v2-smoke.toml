sector = "IT"
task_count = 3
group_size = 2
seed = 20261001
output = "data/v2-06/smoke"
research_budget_usd = 6.0

[seed_data]
path = "generators/worldgen_slack/seeds/slack-examples.json"

[env.timeout]
episode = 21600
finalize = 300

# One model per agent. Unset fields (harness, runtime, sampling) keep the role defaults in config.py.
[env.synthesizer]
model = "openai/gpt-5.6-terra"

[env.builder]
model = "openai/gpt-5.6-terra"

[env.writer]
model = "z-ai/glm-5.3"

[env.judge]
model = "openai/gpt-6-sol"

[env.solver]
model = "z-ai/glm-5.3-flash"

[answer_judge]
model = "openai/gpt-6-sol"
