run_id = "slack-generator-v0"
default_model = "z-ai/glm-5.2"
count = 10
concurrency = 2
output = "data/slack-v0"
max_item_retries = 1

[client]
type = "eval"

[sampling]
temperature = 0.2
max_tokens = 16384

[quality_filter]
min_accept_score = 0.80
accepted_statuses = ["solved"]
retain_rejected_artifacts = false

[quality_filter.weights]
scenario_alignment = 1.00
world_coherence = 1.00
professional_realism = 0.75
discoverability = 1.25
shortcut_free = 1.25

[quality_filter.minimum_scores]
scenario_alignment = 4
world_coherence = 4
professional_realism = 3
discoverability = 4
shortcut_free = 4

[env]
max_concurrent_agents = 1
max_builder_checks = 3
synthesizer_repair_attempts = 1
min_gold_calls = 1
near_duplicate_threshold = 0.92
recent_summary_limit = 10
hidden_seeds = [101, 202]
public_seed = 0
candidate_timeout_seconds = 90.0
public_check_timeout_seconds = 45.0

[env.taskset]
id = "worldgen-slack-generation"

[env.synthesizer]
model = "z-ai/glm-5.2"
max_turns = 5
sampling = { temperature = 0.5, max_tokens = 8192 }
harness = { id = "null" }
runtime = { type = "prime", vm = true, image = "python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a", workdir = "/task", allow = [], block = ["*"], cpu = 1, memory = 2, disk = 5, idle_timeout = 900, labels = ["worldgen-slack", "slack-generator-v0"] }

[env.builder]
model = "z-ai/glm-5.2"
max_turns = 18
sampling = { temperature = 0.2, max_tokens = 16384 }
harness = { id = "rlm", version = "e0080b25afddbc71ecf5476e4f50c3c63edddedb", builtin_skills = ["edit"] }
runtime = { type = "prime", vm = true, image = "python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a", workdir = "/task", allow = [], block = ["*"], cpu = 2, memory = 4, disk = 8, idle_timeout = 900, labels = ["worldgen-slack", "slack-generator-v0"] }

[env.solver]
model = "z-ai/glm-5.2"
max_turns = 10
sampling = { temperature = 0.2, max_tokens = 8192 }
harness = { id = "null" }
runtime = { type = "prime", vm = true, image = "python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a", workdir = "/task", allow = [], block = ["*"], cpu = 1, memory = 2, disk = 5, idle_timeout = 900, labels = ["worldgen-slack", "slack-generator-v0"] }

[env.judge]
model = "z-ai/glm-5.2"
max_turns = 24
sampling = { temperature = 0.1, max_tokens = 8192 }
harness = { id = "rlm", version = "e0080b25afddbc71ecf5476e4f50c3c63edddedb", builtin_skills = [] }
runtime = { type = "prime", vm = true, image = "python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a", workdir = "/task", allow = [], block = ["*"], cpu = 1, memory = 3, disk = 5, idle_timeout = 900, labels = ["worldgen-slack", "slack-generator-v0"] }
retries = { max_retries = 1, include = ["TaskError", "ProviderError", "SandboxError", "HarnessError", "InterceptionError", "TunnelError", "ToolsetError"] }

[env.candidate_runtime]
type = "prime"
vm = true
image = "python:3.12-slim@sha256:2c941e860699f878900b0edc2403613c234d4b32eda3cc9fa7036991a2a63c4a"
workdir = "/task"
allow = []
block = ["*"]
cpu = 2
memory = 3
disk = 8
idle_timeout = 900
labels = ["worldgen-slack", "slack-generator-v0"]

[env.timeout]
episode = 3600
finalize = 300
