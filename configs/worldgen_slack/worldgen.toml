# One generation run: uv run --frozen worldgen-slack --config configs/worldgen_slack/worldgen.toml
# A new world needs a new `seed` and `output`; a run resumes only with the configuration it started with.
# Now: S3 (2026-10-08), S2's sector at 2.5 times its size, with the S2 fixes (C40-C48): 10 days, 1,000 messages, 4 tasks
# per 100 messages (40) in batches of 10, reviewed after days 3 and 6. Scale and the task fixes go together (the
# user's decision, 2026-10-07): scale shows what fails next. S2 (data/v7-02) was seed 20261009, 400 messages, 10 per
# 100; the S2a smoke (data/v7-04-smoke) seed 20261010, 2 days, 80 messages, 8 tasks; S1 (data/v7-01) seed 20261008.
sector = "IT for a business-to-business software company: cloud platform operations, service releases, and customer incident coordination"
seed = 20261011
output = "data/v7-05/software"
storylines = 3            # the plot the ledger plans before day 1

# One author writes the world in time order.
[author]
review_days = [3, 6]      # the judge reviews the world after these days, and at the end
keepalive = 600           # seconds between pings of the author's VM while the judge works

# Built by: duckdb < scripts/worldgen_slack/personas.sql
[personas]
path = "data/seeds/personas-usa.jsonl"
typing = "data/seeds/typing-profiles.jsonl"
gaps = "data/seeds/reply-gaps.json"

[calendar]
days = 10

# The workspace's shape: code places conversations by these targets, and measure.py scores the world against them.
[activity]
messages = 1000           # whole world, storylines included (estimate; 80 for a smoke)
channel_skew = 1.1        # Zipf exponent over channels ranked by members (estimate)
dms_per_person = 0.4      # direct-message pairs per person (estimate)
dm_share = 0.25           # share of background messages in DMs (estimate)
conversation_lines = 6    # mean lines of a background conversation (estimate)
reply_share = 0.3         # share of messages that are thread replies (vendor survey, low confidence)
reaction_rate = 0.2       # share of messages with at least one reaction (estimate)
mention_rate = 0.11       # measured: spencer/software_slacks, deduplicated; checked per day, ± mention_tolerance
emoji_rate = 0.08         # measured, same corpus; scorecard only
parts = { early = 0.1, morning = 0.35, afternoon = 0.4, evening = 0.12, night = 0.03 }  # workday rhythm (estimate)

# One model per agent. Unset fields (harness, runtime, sampling) keep the role defaults in config.py.
[env.timeout]
episode = 43200
finalize = 300

[env.author]
model = "anthropic/claude-opus-5.5"  # the voice lab (2026-10-04): 0.77 blind realism on one prompt, against terra's 0.43

# Anthropic caches a prompt only when asked: each request's prefix is cached up to its end, so an agent's next step
# pays for its new tail alone. Without it every step was billed in full, and the harness's token cap (new tokens only)
# cut smoke 02's second day. The cache lives an hour: a probe keeps the author waiting 8 to 39 minutes (S2), past the
# default five, and each hardening turn then re-read its whole context uncached until S2's batch 4 hit the cap.
[env.author.sampling]
cache_control = { type = "ephemeral", ttl = "1h" }

[env.judge]
model = "openai/gpt-6-sol"
