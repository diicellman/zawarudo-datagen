# The W2 smoke (2026-10-18): four days of W2 at its daily volume, with its 120 people, its ledger held to about a
# tenth of W2's targets and its promises slipping, to catch faults before W2 runs (about $15-25): the organization of
# 120, a plan that meets its targets, days of about 170 messages inside the author's caps, a slip the judge lets stand.
sector = "a consumer smart-home hardware company: firmware and companion-app releases, contract manufacturing and component supply, certification and retail launches, and customer support"
seed = 20261019
output = "data/v8-05/smoke-w2"
storylines = 3            # the plot the ledger plans before day 1
max_losses = 3            # lost sessions a day may take (W1 lost 4 in 2.9 hours), each a fresh VM after a pause

# What the ledger holds at least, counted off the plan (world/profile.py): about a tenth of W2's, each kind at least
# once.
[ledger]
facts = 24
chains = 3                # values superseded 3 deep, across 2 or more channels
deep_chains = 1           # 4 deep
decoys = 3                # each beside a real value of its subject and attribute
private_truths = 2        # a value that changed, its current one in a private channel or a DM
collections = 1           # 4 or more items of a set, across 3 or more channels, an item's value changed
archives = 1
departures = 1

# One author writes the world in time order.
[author]
review_days = [2]         # the judge reviews the world after these days, and at the end
keepalive = 600           # seconds between pings of the author's VM while the judge works
day_attempts = 3          # a day about 1.7 times W1's is likelier to fail twice

# Built by: duckdb < scripts/worldgen_slack/personas.sql
[personas]
path = "data/seeds/personas-usa.jsonl"
typing = "data/seeds/typing-profiles.jsonl"
gaps = "data/seeds/reply-gaps.json"
pool = 120                # people at the company

[calendar]
days = 4

# The workspace's shape: code places conversations by these targets, and measure.py scores the world against them.
[activity]
messages = 680            # W2's four workdays (about 170 people's messages each); apps post beside them
channel_skew = 1.3        # Zipf exponent over channels ranked by members: busy channels 3-5 read_channel pages deep
dms_per_person = 0.4      # direct-message pairs per person (estimate)
dm_share = 0.25           # share of background messages in DMs (estimate)
conversation_lines = 6    # mean lines of a background conversation (estimate)
reply_share = 0.3         # share of messages that are thread replies (vendor survey, low confidence)
reaction_rate = 0.2       # share of messages with at least one reaction (estimate)
mention_rate = 0.11       # measured: spencer/software_slacks, deduplicated; checked per day, ± mention_tolerance
emoji_rate = 0.08         # measured, same corpus; scorecard only
parts = { early = 0.1, morning = 0.35, afternoon = 0.4, evening = 0.12, night = 0.03 }  # workday rhythm (estimate)
bot_posts = 3.0           # each app's routine posts per workday (the apps the organization lists)
promise_rate = 0.03       # promises made per message, at least, each day
promise_slips = 0.3       # of the promises made so far, at least this share slip, change or are dropped

# One model per agent. Unset fields (harness, runtime, sampling) keep the role defaults in config.py.
[env.timeout]
episode = 43200           # the run's wall clock
finalize = 300

[env.author]
model = "anthropic/claude-opus-5.5"  # blind judges rated its days 0.77 for realism on one prompt, the next best 0.43

# Anthropic caches a prompt only when asked: each request's prefix is cached up to its end, so an agent's next step
# pays for its new tail alone; without it every step is billed in full, and the harness's token cap (new tokens only)
# cuts a long day short. The cache lives an hour, not the default five minutes: a review keeps the author waiting
# longer than that.
[env.author.sampling]
cache_control = { type = "ephemeral", ttl = "1h" }

# The judge: GLM 5.3, thinking at "high", the middle of its three efforts (low, high, max).
[env.judge]
model = "z-ai/glm-5.3"

[env.judge.sampling]
reasoning_effort = "high"
