# The pilot of the forge on W1: uv run --frozen worldgen-slack forge --config configs/worldgen_slack/forge-w1.toml
# 36 initial tasks, then their harder, easier and repaired versions: about 65 tasks, for the user to label.
world = "data/v8-02/w1"
output = "data/v8-04/forge-w1"
tasks = 36
batch = 4                 # a turn's ids, one of each family: flash surveys the world before it writes, and at 12 ids
                          # its 1.5M tokens ran out before the first (the W1 pilot, 2026-10-17)
adapt = 1
tries = 8
verify = 2
spend_limit = 80.0          # a guard against a runaway, not a budget: the smoke labelled a task for about $0.50

# One model per seat. The proposer is smaller than the models that check its tasks, so none judges its own writing;
# the student, whose pass rates select the tasks, is of another family; unset fields keep the seat defaults.
[env.proposer]
model = "z-ai/glm-5.3-flash"

[env.verifier]            # reaches each task's answer from Slack, or the task is dropped
model = "z-ai/glm-5.3"

[env.solver]              # the student
model = "deepseek/deepseek-v4.1-flash"

[judge]                   # the task judge: realistic, one reading, exact, supported
model = "z-ai/glm-5.3"

[judge.sampling]
reasoning_effort = "high"

[answer_judge]            # grades every try against a task's answer
model = "z-ai/glm-5.3"

[answer_judge.sampling]
reasoning_effort = "high"
