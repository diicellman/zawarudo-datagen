# forge-w2 regraded by grader v2: uv run --frozen worldgen-slack regrade --config configs/worldgen_slack/forge-w2-v2.toml \
#     --splits local-docs/calibration/forge-w2/reference
# forge-w2's configuration with grader v2 (2026-10-21): the model reads what an answer commits to, code grades it by
# the policy (local-docs/calibration/POLICY.md); correctness only, grounding by code. A regrade keeps the run's own
# manifest; a forge run with this file would be refused as another configuration.
# The forge on W2: uv run --frozen worldgen-slack forge --config configs/worldgen_slack/forge-w2.toml
# 150 initial tasks, then their harder, easier and repaired versions: about 270 tasks. W1's pilot (67 tasks, $74.49)
# had 2% of its parts aggregation and a quarter of its requests opening alike; here code deals each id a skill and the
# proposer sees what its tasks cover so far.
world = "data/v8-05/w2"
output = "data/v8-05/forge-w2"
tasks = 150
batch = 4                 # a turn's ids, one of each family: a turn of 12 had GLM 5.3 flash survey the world until its
                          # 1.5M tokens ran out, before it wrote one (the W1 pilot, 2026-10-17)
adapt = 1
tries = 8
solvers = 24              # a regrade's grading calls at once: GLM takes 32, and nothing else runs
verify = 2
# The skills code deals the initial ids, in turn: aggregation twice in 5 (the research's surest near-miss for a fast
# model, and W1's rarest), then temporal, abstention and synthesis. Crossed with the 4 families, every pair occurs
# within 20 ids.
skills = ["aggregation", "temporal", "aggregation", "abstention", "synthesis"]
offers = 3                # turns an id is offered unwritten before it is dropped, short of material
spend_limit = 600.0       # a guard against a runaway, not a budget: the pilot cost about $1.11 a task

# The proposer works in a Docker container on the research VM, of the agents' image (the rlm harness installed), as W2's
# author did: W2 ran 40 days with no lost session there, where Prime's sandbox streams dropped 6 times on its smoke.
[env]
sandbox = "docker"
docker_image = "sha256:86fe169858e8270c367f687ad9a4e6e52d15f99e8ba3bcf65fb5327c345668e8"

# One model per seat. The proposer, the models that check its tasks and the student, whose pass rates select them,
# are of three families, so none checks its own family's writing; unset fields keep the seat defaults.
[env.proposer]
model = "anthropic/claude-opus-5.5"

# Anthropic caches a prompt only when asked: each step then pays for its new tail alone. The cache lives an hour, as
# the proposer's VM waits while a pass is labelled.
[env.proposer.sampling]
cache_control = { type = "ephemeral", ttl = "1h" }

[env.verifier]            # reaches each task's answer from Slack, or the task is dropped
model = "z-ai/glm-5.3"

# At "max": on the forge's smoke, at "high" it missed a later correction in another channel on both tries of 2 tasks
# whose gold was right; a probe of them (local-docs/tools-v8/verifier-probe) had max reach every part of 6 tries,
# high 5 of 6, gpt-6-sol 3 of 6 (2026-10-19).
[env.verifier.sampling]
reasoning_effort = "max"

[env.solver]              # the student
model = "deepseek/deepseek-v4.1-flash"

[judge]                   # the task judge: realistic, one reading, exact, supported
model = "z-ai/glm-5.3"

[judge.sampling]
reasoning_effort = "high"

[answer_judge]            # grades every try against a task's answer
model = "z-ai/glm-5.3"

[answer_judge.sampling]
reasoning_effort = "high"

# Grader v2: on forge-w2's calibration (350 tries, 70 ruled) as accurate as v1's fresh pass at a fifth of its cost.
[grading]
version = 2
ground = false
