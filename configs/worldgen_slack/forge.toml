# One forge: uv run --frozen worldgen-slack forge --config configs/worldgen_slack/forge.toml [--dry-run]
# F1 (2026-10-10): tasks on S3's finished world (data/v7-05/software: 953 messages, 59 facts, a board of 20 planned
# tasks), which stays frozen. The forge proposes, tries and keeps toward a goal of 40 tasks, at most 2 per category and
# level (24 places), with every board entry covered; it stops there, after 12 rounds, or after two rounds that place
# nothing. S3's own 40 tasks, re-measured the same way (measure-s3.toml), are the baseline. A new forge needs a new
# `output`; one resumes only with the configuration it started with.
world = "data/v7-05/software"
output = "data/v7-05/forge-01"
taxonomy = "configs/worldgen_slack/taxonomy.toml"
tasks = 40                # the goal: kept tasks
target = 2                # the tasks one place (a category and a measured level) holds
rounds = 12               # the most rounds toward the goal
candidates = 12           # one round's candidates, tried 8 times each

# Per level, the band of the solver's right-answer rate a task of that level measures in: level 1 anchors that most
# tries get right; level 4 tasks the solver rarely answers, and the witness must.
bands = [[0.75, 1.0], [0.5, 0.75], [0.25, 0.5], [0.0, 0.25]]
max_answer_rows = 12      # exhaustive sets: a set of n is right about p^n of the time (WideSearch)
tries = 8                 # the solver's tries of a candidate, sampled at temperature 1
keepalive = 600           # seconds between pings of the proposer's VM while the solver and the judge work

# One model per seat. Unset fields (harness, runtime, sampling) keep the seat defaults in config.py.
[env.timeout]
episode = 43200
finalize = 300

# The proposer: the world author's model, its prompt cached for an hour, as a round keeps it waiting while the solver
# tries the candidates.
[env.proposer]
model = "anthropic/claude-opus-5.5"

[env.proposer.sampling]
cache_control = { type = "ephemeral", ttl = "1h" }

[env.judge]
model = "openai/gpt-6-sol"

[env.solver]
model = "z-ai/glm-5.3-flash"

[env.witness]             # tries the tasks the solver rarely answers: hard, or broken?
model = "openai/gpt-6-sol"

[answer_judge]
model = "openai/gpt-6-sol"
