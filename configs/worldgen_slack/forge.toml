# One forge: uv run --frozen worldgen-slack forge --config configs/worldgen_slack/forge.toml [--dry-run]
# Tasks on a finished world, as three sets (Synthetic Data RL, 2505.17063): the proposer writes `tasks` of them; each is
# verified, measured by the student and judged; then a harder version of each the student always answers, an easier
# one of each it never does, and a repaired one of each the judge refused are written and labelled too.
world = "data/v8-02/w1"
output = "data/v8-04/forge"
tasks = 36                # the initial set
batch = 12                # tasks per proposer turn
adapt = 1                 # adapting passes
tries = 8                 # the student's tries of a task
verify = 2                # the verifier's (a third on a split)
spend_limit = 40.0        # dollars, reported or at list prices

# One model per seat. The proposer is smaller than the models that check its tasks, so none judges its own writing;
# the student, whose pass rates select the tasks, is of another family; unset fields keep the seat defaults.
[env.proposer]
model = "z-ai/glm-5.3-flash"

[env.verifier]            # reaches each task's answer from Slack, or the task is dropped
model = "z-ai/glm-5.3"

[env.solver]              # the student
model = "deepseek/deepseek-v4.1-flash"

[judge]                   # the task judge: realistic, one reading, exact, supported
model = "z-ai/glm-5.3"

[judge.sampling]
reasoning_effort = "high"

[answer_judge]            # grades every try against a task's answer
model = "z-ai/glm-5.3"

[answer_judge.sampling]
reasoning_effort = "high"
