# W1 (2026-10-14): the first world of Scale-1, phase B's world generation. A new sector; the world closer to Slack:
# apps posting by code, links and groups, natural times, a checked mention share, promises, people coming and going.
# A forge (FW1) writes its tasks on the finished world. Gates before the run: the tests, ruff, the smoke
# (smoke-w1.toml) and a --dry-run.
sector = "an online retailer of home goods: storefront and app releases, fulfillment and warehouse operations, and customer support"
seed = 20261016
output = "data/v8-02/w1"
storylines = 4            # the plot the ledger plans before day 1

# One author writes the world in time order.
[author]
review_days = [5, 10, 15]  # the judge reviews the world after these days, and at the end
keepalive = 600           # seconds between pings of the author's VM while the judge works

# Built by: duckdb < scripts/worldgen_slack/personas.sql
[personas]
path = "data/seeds/personas-usa.jsonl"
typing = "data/seeds/typing-profiles.jsonl"
gaps = "data/seeds/reply-gaps.json"
pool = 60                 # people at the company

[calendar]
days = 20

# The workspace's shape: code places conversations by these targets, and measure.py scores the world against them.
[activity]
messages = 1500           # people's messages, storylines included; apps post beside them
channel_skew = 1.1        # Zipf exponent over channels ranked by members (estimate)
dms_per_person = 0.4      # direct-message pairs per person (estimate)
dm_share = 0.25           # share of background messages in DMs (estimate)
conversation_lines = 6    # mean lines of a background conversation (estimate)
reply_share = 0.3         # share of messages that are thread replies (vendor survey, low confidence)
reaction_rate = 0.2       # share of messages with at least one reaction (estimate)
mention_rate = 0.11       # measured: spencer/software_slacks, deduplicated; checked per day, ± mention_tolerance
emoji_rate = 0.08         # measured, same corpus; scorecard only
parts = { early = 0.1, morning = 0.35, afternoon = 0.4, evening = 0.12, night = 0.03 }  # workday rhythm (estimate)
bot_posts = 3.0           # each app's routine posts per workday (the apps the organization lists)
promise_rate = 0.03       # promises made per message, at least, each day

# One model per agent. Unset fields (harness, runtime, sampling) keep the role defaults in config.py.
[env.timeout]
episode = 43200
finalize = 300

[env.author]
model = "anthropic/claude-opus-5.5"  # blind judges rated its days 0.77 for realism on one prompt, the next best 0.43

# Anthropic caches a prompt only when asked: each request's prefix is cached up to its end, so an agent's next step
# pays for its new tail alone; without it every step is billed in full, and the harness's token cap (new tokens only)
# cuts a long day short. The cache lives an hour, not the default five minutes: a review keeps the author waiting
# longer than that.
[env.author.sampling]
cache_control = { type = "ephemeral", ttl = "1h" }

# The judge: GLM 5.3, thinking at "high", the middle of its three efforts (low, high, max). OpenAI's models refuse
# this account, so the first W1 (data/v8-01/w1) stopped at its day-10 review.
[env.judge]
model = "z-ai/glm-5.3"

[env.judge.sampling]
reasoning_effort = "high"
