[project]
name = "zawarudo-datagen"
version = "0.1.0"
description = "Backward generation of synthetic Slack worlds and QA tasks with Verifiers v1 agents"
readme = "README.md"
authors = [
    { name = "diicell", email = "diicellman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "verifiers",
    "worldgen-slack",
]

[project.scripts]
worldgen-slack = "generators.worldgen_slack.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generators"]

[tool.hatch.build.targets.sdist]
include = ["/generators", "/environments/worldgen_slack", "/configs", "/README.md", "/uv.lock"]

[tool.uv.sources]
worldgen-slack = { workspace = true }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "ac2ec29" }

[dependency-groups]
dev = ["ruff==0.14.3"]

[tool.ruff]
line-length = 110

[tool.uv.workspace]
members = ["environments/worldgen_slack"]
