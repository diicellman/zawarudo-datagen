[project]
name = "zawarudo-datagen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "diicell", email = "diicellman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "verifiers",
    "worldgen-slack",
]

[project.scripts]
zawarudo-datagen = "zawarudo_datagen:main"
worldgen-slack = "generators.worldgen_slack.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zawarudo_datagen", "generators"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/generators", "/environments/worldgen_slack", "/configs", "/README.md", "/uv.lock"]

[tool.uv.sources]
worldgen-slack = { workspace = true }
verifiers = { git = "https://github.com/PrimeIntellect-ai/verifiers.git", rev = "ac2ec29" }

[dependency-groups]
dev = ["ruff==0.14.3"]

[tool.ruff]
line-length = 110

[tool.uv.workspace]
members = ["environments/worldgen_slack"]
