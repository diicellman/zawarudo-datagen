# The checks' own taxonomy: a copy of configs/worldgen_slack/taxonomy.toml, so that editing the runs' changes no
# check.

# How a question is asked; the seed draws one per entry, as DataDesigner draws instruction styles.
styles = [
  "a direct question",
  "a request to look something up, in the imperative",
  "a question with a sentence of context about why the asker needs it",
  "a terse question, the way someone types in a hurry",
]

[categories.lookup]
gold = "sql"
answer_types = ["text", "set", "number"]
definition = "Read one thing off the workspace's structure: who posted, where, when, in which thread, who is a member, who reacted."
levels = [
  "one message or directory entry",
  "a reply inside a thread, or a read narrowed by a filter",
  "one of many look-alike routine posts, told apart by one detail",
  "a message the question describes only by what surrounds it (who answered, what came just before or after), among near-identical messages in a busy channel",
]
concepts = [
  ["who posted a message the question describes", "which channel holds a message the question describes", "a person's title or team in the directory"],
  ["who replied in the thread of a message the question describes", "a message narrowed down by its author and its day", "who reacted to a message the question describes"],
  ["one of several look-alike routine posts, told apart by its author, day or a number", "the earliest or the latest of many similar messages", "a reply deep in a long thread"],
  ["the message just before or after a described one in a busy channel", "one of several near-identical messages, told apart by who reacted or replied", "a reply deep in a long thread, described by the discussion around it"],
]

[categories.search]
gold = "ledger"
answer_types = ["text", "set", "number"]
definition = "Find the message that states a fact the question asks about, and answer with that fact."
levels = [
  "one exact keyword finds one message",
  "finding it needs combined filters: a person, a date, a channel",
  "the question names it only partly or indirectly, several messages look plausible, and some are distractors",
  "the fact is stated in other words than the question uses, where keyword search does not reach first, among near-misses that look final",
]
concepts = [
  ["a fact stated once, with a distinctive word in the question"],
  ["a fact found by combining who said it, where and on which day", "a fact stated only in a direct message"],
  ["a fact the question names only indirectly", "a fact among near-miss messages about the same subject", "a fact whose keyword also appears in unrelated chatter"],
  ["a fact stated with a synonym or nickname the question does not use", "a fact stated only as a reply in a thread about something else", "a fact only a direct message states, with public near-misses"],
]
needs = [{}, {}, {decoys = 1, named = 0}, {decoys = 2, hidden = true, named = 0}]

[categories.semantic]
gold = "ledger"
answer_types = ["text", "set", "number"]
definition = "Answer from facts related to each other: a value superseded by a later one, an alias, a value split across messages, a contradiction."
levels = [
  "one relation, such as a superseded value",
  "two relations, or an alias",
  "a value split across messages, together with a decoy and a contradiction",
  "a value that follows from three or more changes across channels and days, one only a correction in a thread, beside a decoy never retracted",
]
concepts = [
  ["a value superseded once by a later message"],
  ["a value superseded twice", "a value the later messages refer to by another name", "a value corrected in a reply thread"],
  ["a value split across messages in two channels", "a credible decoy that is never explicitly retracted", "a contradiction settled by the more authoritative person", "a change only a later thread reply under the original post states"],
  ["a value changed three times across channels, the last change a thread reply", "a value whose latest change comes from someone other than its owner, in another channel", "a decision reversed, then partly restored by someone with more authority"],
]
needs = [{relations = 1}, {relations = 1}, {relations = 1, channels = 2, decoys = 1, hidden = true}, {relations = 2, channels = 3, decoys = 1, hidden = true, named = 0}]

[categories.join]
gold = "sql"
answer_types = ["text", "set", "number"]
definition = "Combine the workspace's structure across channels, threads, members and reactions: compare, intersect, subtract or count."
levels = [
  "two hops",
  "three hops with a filter",
  "four or more hops with a set operation or a time window",
  "a set or count across four or more channels or threads within a time window, with a condition on reactions or replies, that changes if any one place is missed",
]
concepts = [
  ["members of a channel who posted in it", "repliers of a thread who also reacted in it"],
  ["people active in one channel but not in another", "replies within the threads of one person"],
  ["a set difference across channels within a time window", "people who reacted to every message of a kind", "distinct participants across several threads within a window"],
  ["people who replied in every thread of a kind within a window", "messages in one channel reacted to by people who never posted there", "people active in three channels but silent in a fourth within a window"],
]

[categories.hybrid]
gold = "hybrid"
answer_types = ["text", "set", "number"]
definition = "Find the message that states a fact, then answer a structural question about that message: who replied, reacted, was mentioned, or stayed silent."
levels = [
  "the message plus one join",
  "the message plus two joins",
  "the message plus joins and a time window",
  "the message is found only among near-misses or by a paraphrase, and the structural question spans its thread and another channel",
]
concepts = [
  ["who replied to the message stating a fact", "who reacted to the message stating a fact"],
  ["who both reacted to and replied to the message stating a fact", "who was mentioned around the message stating a fact"],
  ["which members of a channel stayed silent within a window after the message stating a fact"],
  ["who reacted to the message stating a fact, found among near-identical announcements, and also posted in another channel that day", "who replied to the correction of a fact but not to its first statement"],
]
needs = [{}, {}, {decoys = 1}, {decoys = 1}]

# Robustness levels 3 and 4: a value the asker can see that was settled where they cannot is a status answer, the
# latest visible value given as not settled, not a refusal: a solver finds the provisional value and its caveat, and
# a refusal grades that wrong.
[categories.robustness]
gold = "sql"              # a status answer's gold reads the ledger: its value as the asker can see it stated
answer_types = ["refusal", "status"]
definition = "A request the asker cannot fulfill as asked from what they can see; the right answer says so, and why: nothing to find, or only a value that is not settled."
levels = [
  "what it asks about does not exist",
  "what it asks about is in a conversation the asker cannot read",
  "a value the asker can see that was changed or settled where they cannot: the right answer gives it as not settled",
  "visible near-misses (an older plan, a namesake, a draft) look like answers, while the settled value exists only where the asker cannot read: the right answer gives the latest value they can see, as not settled",
]
concepts = [
  ["a project, person or decision that never appears in the workspace"],
  ["a decision discussed only in a private channel the asker is not in", "a detail settled only in a direct message between others"],
  ["a figure posted as provisional and settled only in a direct message", "a decision asked about as final that was changed in a private channel", "work asked about as owned by someone who handed it off privately"],
  ["an outdated public plan a private decision replaced", "a figure discussed publicly as an estimate and settled only in a private channel", "a swap arranged in direct messages behind a posted roster"],
]
needs = [{}, {}, {}, {decoys = 1}]
